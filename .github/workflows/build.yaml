name: Build

on:
  push:
  schedule:
    - cron: '12 02 * * *'
  workflow_dispatch:

jobs:
  build:
    uses: pschmitt/ci-workflows/.github/workflows/docker-build.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      image-name: pschmitt/github-backup
      platforms: linux/amd64,linux/arm64
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_password: ${{ secrets.DOCKERHUB_TOKEN }}
